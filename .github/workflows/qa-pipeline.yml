name: Staging Pipeline

on:
    pull_request:
        types:
            - closed
        branches:
            - 'staging'

jobs:
    validate:
        if: github.event.pull_request.merged == true
        uses: ./.github/workflows/laravel-tests.yml

    build-and-deploy:
        needs: validate
        if: github.event.pull_request.merged == true
        runs-on: ubuntu-latest
        steps:
            - name: 'Checkout GitHub Action'
              uses: actions/checkout@main

            - name: Validate Laravel 13 lockfile
              run: |
                  python3 - <<'PYTHON'
                  import json
                  data = json.load(open('composer.lock'))
                  framework = next(p for p in data['packages'] if p['name'] == 'laravel/framework')
                  assert framework['version'].lstrip('v').startswith('13.'), 'Resolve and commit the Laravel 13 composer.lock before deploying'
                  PYTHON

            - name: 'Login via Azure CLI'
              uses: azure/login@v1
              with:
                  creds: ${{ secrets.AZURE_CREDENTIALS }}

            - name: 'Set up Kubernetes'
              uses: azure/aks-set-context@v2
              with:
                  creds: ${{ secrets.AZURE_CREDENTIALS }}
                  cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}
                  resource-group: ${{ secrets.AKS_RESOURCE_GROUP }}

            - name: 'Build and push image'
              uses: azure/docker-login@v1
              with:
                  login-server: ${{ secrets.REGISTRY_LOGIN_SERVER }}
                  username: ${{ secrets.REGISTRY_USERNAME }}
                  password: ${{ secrets.REGISTRY_PASSWORD }}
            - run: |
                  docker build --pull --build-arg SWAGGER_URL=https://preparemessages-stage.ifrc.org/api -t ${{ secrets.REGISTRY_LOGIN_SERVER }}/whatnow-qa:${{ github.sha }} -f ./docker/Dockerfile .
                  bash docker/test-php-runtime.sh ${{ secrets.REGISTRY_LOGIN_SERVER }}/whatnow-qa:${{ github.sha }}
                  docker tag ${{ secrets.REGISTRY_LOGIN_SERVER }}/whatnow-qa:${{ github.sha }} ${{ secrets.REGISTRY_LOGIN_SERVER }}/whatnow-qa:latest

                  docker push ${{ secrets.REGISTRY_LOGIN_SERVER }}/whatnow-qa:${{ github.sha }}
                  docker push ${{ secrets.REGISTRY_LOGIN_SERVER }}/whatnow-qa:latest

            - name: 'Copy staging values file'
              run: |
                  cp ./helm-chart-backoffice/values-staging.yaml ./helm-chart-backoffice/values.yaml


            - name: 'Deploy to AKS with Helm'
              run: |
                  helm upgrade --install whatnow-backoffice-qa ./helm-chart-backoffice \
                    --namespace ${{ secrets.AKS_CLUSTER_NAMESPACE_QA }} \
                    --create-namespace \
                    --set-string image.tag=${{ github.sha }} \
                    --wait --timeout 10m
