name: PHP security runtime check

on:
    workflow_dispatch:
    pull_request:
        paths:
            - 'docker/**'
            - '.dockerignore'
            - '.github/workflows/php-security-check.yml'

permissions:
    contents: read

jobs:
    php-runtime:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4
            - name: Build PHP 8.4 runtime
              run: docker build --pull --target php-runtime -f docker/Dockerfile -t whatnow-php-security:${{ github.sha }} .
            - name: Verify CLI and Apache runtime
              run: bash docker/test-php-runtime.sh whatnow-php-security:${{ github.sha }}
